<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brüce Web</title>
<meta name="description" content="Brüce in the browser: an unofficial client for your Bruce Studios membership. Book classes, manage your bookings and browse studios. Not affiliated with Bruce Studios AB.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07090a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6ee" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brüce">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<script>
  try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/classes" aria-label="Brüce, classes"><img src="../favicon.svg" width="28" height="28" alt=""><span>BRÜCE</span><em>web</em></a>
  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <a href="#/classes" data-tab="classes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg><span>Classes</span></a>
    <a href="#/studios" data-tab="studios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Studios</span></a>
    <a href="#/mine" data-tab="mine"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l2.5 2.5L16 9M5 4h14v16H5z"/></svg><span>My classes</span></a>
    <a href="#/account" data-tab="account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Account</span></a>
  </nav>
</header>
<main id="main" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="confirm">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="row end">
      <button value="cancel" class="btn ghost">Keep</button>
      <button value="ok" class="btn danger" id="confirm-ok">OK</button>
    </div>
  </form>
</dialog>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
