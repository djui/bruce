name = "bruce-autobook"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Every minute; the worker only calls Bruce every 5th minute (scan) and in the minute before a class opens.
[triggers]
crons = ["* * * * *"]

# Create with: npx wrangler kv namespace create AUTOBOOK, then paste the id here.
[[kv_namespaces]]
binding = "AUTOBOOK"
id = "ef5bdcd0afab41b0ac5a071ed1c4558f"
