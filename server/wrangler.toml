name = "bruce-autobook"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Every minute; the worker only calls Bruce for each user every 5th minute (scan) and in the minute before a class opens.
# Daily at 02:30 UTC: re-read stored users' booking history for challenges, goal reminders, Wrapped percentiles and
# skipped-habit pushes (sent by the minute cron at 08:00 local)
# (keep it equal to DAILY_CRON in src/worker.js).
[triggers]
crons = ["* * * * *", "30 2 * * *"]

# Created with: npx wrangler d1 create bruce-autobook. The users table is created on first use, the rest by migrations.
[[d1_databases]]
binding = "DB"
database_name = "bruce-autobook"
database_id = "39f77894-b4c9-4842-b8be-256aa1e353c4"
# challenges, participants, daily_counts, nudges, user_races (+ price reminders), crew_updates: npx wrangler d1 migrations apply bruce-autobook --remote
migrations_dir = "migrations"

[vars]
APNS_TOPIC = "net.dauernheim.bruce"
# Booking-result emails go out through Resend (resend.com, free tier: 3,000 a month, 100 a day) from a domain verified
# there; set the key with: npx wrangler secret put RESEND_API_KEY. Without the key no email is sent.
EMAIL_FROM = "Brüce auto-book <autobook@tripweave.studio>"
